[package]
name = "rtl-sdr-rs"
version = "0.3.1"
edition = "2021"
license = "MPL-2.0"
description = "RTL-SDR USB software defined radio library"
repository = "https://github.com/ccostes/rtl-sdr-rs"
readme = "readme.md"
keywords = ["rtl-sdr", "sdr", "radio"]
exclude = ["capture.bin"]

[features]
default = []
rtl_sdr_blog = []
disable-simd = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusb = "0.9"
# Pulled in transitively via `rusb`, but called directly for the
# async streaming API (rusb 0.9 doesn't surface libusb's
# bulk-transfer async machinery yet).
libusb1-sys = "0.7"
# `libc::timeval` for the libusb_handle_events_timeout_completed
# event-loop poll. Already a transitive dep of `libusb1-sys`; we
# pin it explicitly so the build doesn't break if rusb/libusb1-sys
# stops re-exporting it.
libc = "0.2"
byteorder = "1"
log = "0.4"
mockall = "0.11"

[dev-dependencies]
rusb = "0.9"
byteorder = "1"
ctrlc = "3.2.3"
num-complex = "0.4"
stderrlog = "0.5"
criterion = "0.5.1"
